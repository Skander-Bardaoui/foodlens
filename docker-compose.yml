name: foodlens

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodlens}
      POSTGRES_DB: ${POSTGRES_DB:-foodlens}
    volumes:
      - foodlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      args:
        HF_MODEL_ID: ${HF_MODEL_ID:-nateraw/food}
    restart: unless-stopped
    # Development bind mounts are edited on the host; override the production user.
    user: root
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://foodlens:foodlens@db:5432/foodlens}
      HF_MODEL_ID: ${HF_MODEL_ID:-nateraw/food}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      ANALYZE_RATE_LIMIT_PER_MINUTE: ${ANALYZE_RATE_LIMIT_PER_MINUTE:-10}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - foodlens_hf_cache:/cache/huggingface
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log --reload-exclude \"uploads/*\""

  web:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_PROXY_TARGET: http://api:8000
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  foodlens_pgdata:
  foodlens_hf_cache:
